<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Clean Light is the default; dark only when the user picked it here.
      try { if (localStorage.getItem('tracker.theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark') } catch (e) {}
    </script>
    <title>Tracker · Solorion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
